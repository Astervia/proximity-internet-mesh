# Auto-IP chain relay1 config.
# relay1 sits between the gateway and relay2 and must acquire its own mesh IP.

[node]
name = "relay1-auto-chain"
data_dir = "/var/lib/pim"

[interface]
mesh_ip = "auto"
mtu = 1400

[relay]
enabled = true

[transport]
listen_port = 9100

[security]
key_file = "/var/lib/pim/node.key"

[[peers]]
mechanism = "tcp"
address = "172.37.0.10:9100"
label = "gateway"

[[peers]]
mechanism = "tcp"
address = "172.37.0.21:9100"
label = "relay2"
