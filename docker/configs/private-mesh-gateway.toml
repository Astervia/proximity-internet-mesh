[node]
name = "gateway"
data_dir = "/var/lib/pim"

[interface]
mtu = 1400

[discovery]
enabled = true

[mesh]
mode = "private"
passphrase = "correct horse battery staple"
mesh_id = "office"

# Weak Argon2 params for the lab so docker startup isn't dominated by
# KDF cost. Production defaults are 64 MiB / t=3.
[mesh.kdf]
m_cost_kib = 8
t_cost = 1
p_cost = 1

[transport]
listen_port = 9100

[gateway]
enabled = true
nat_interface = "eth0"

[security]
key_file = "/var/lib/pim/node.key"
require_encryption = true
authorization_policy = "allow_all"
trust_store_file = "/var/lib/pim/trusted-peers.toml"
