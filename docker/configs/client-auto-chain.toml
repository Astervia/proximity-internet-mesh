# Auto-IP chain client config.
# The client only peers with relay2 and must acquire its mesh IP through the chain.

[node]
name = "client-auto-chain"
data_dir = "/var/lib/pim"

[interface]
mesh_ip = "auto"
mtu = 1400

[transport]
listen_port = 9100
connect_timeout_ms = 3000

[discovery]
enabled = false

[security]
key_file = "/var/lib/pim/node.key"

[[peers]]
mechanism = "tcp"
address = "172.37.0.21:9100"
label = "relay2"
