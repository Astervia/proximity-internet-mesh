# Relay for multi-gateway tests (Phase 5).
# Connected to both gateway1 and gateway2 so it can route to either.

[node]
name = "relay"
data_dir = "/var/lib/pim"

[interface]
mtu = 1400

[transport]
listen_port = 9100

[security]
key_file = "/var/lib/pim/node.key"

[[peers]]
mechanism = "tcp"
address = "gateway1:9100"
label = "gateway1"

[[peers]]
mechanism = "tcp"
address = "gateway2:9100"
label = "gateway2"
