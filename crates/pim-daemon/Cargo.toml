[package]
name = "pim-daemon"
version = "0.1.18"
edition = "2021"
description = "Background daemon process for the Proximity Internet Mesh"
license.workspace = true
repository.workspace = true

[features]
default = ["messaging"]
# Optional in-process plugins. Building with `--no-default-features`
# yields a daemon that runs without messaging compiled in (no
# messages.* RPC methods, no messages.db).
messaging = ["dep:pim-messaging"]

# Phase A added the rlib alongside the existing bin so mobile
# embeddings (Phase B Android, future iOS) can link the daemon
# in-process. Phase B adds `cdylib` so the android target produces a
# `libpim_daemon.so` that Gradle drops into the APK's `jniLibs`. The
# rlib is still built for desktop callers and tests; `cdylib` is a
# no-op overhead on host targets that don't link it.
[lib]
name = "pim_daemon"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "pim-daemon"
path = "src/main.rs"

[dependencies]
pim-bluetooth = { workspace = true }
pim-core = { workspace = true }
pim-crypto = { workspace = true }
pim-protocol = { workspace = true }
pim-plugin = { workspace = true }
pim-transport = { workspace = true }
pim-tun = { workspace = true }
pim-gateway = { workspace = true }
pim-discovery = { workspace = true }
pim-routing = { workspace = true }
pim-wifidirect = { workspace = true }
pim-messaging = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
bytes = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
libc = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }

# Phase B: JNI bridge. Pulled in only for android so the desktop
# binary build doesn't grow a dep that ships nothing useful on Linux
# or macOS. `tracing-android` writes to logcat from the same `tracing`
# events the rest of the daemon emits.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
tracing-android = "0.2"
ndk-context = "0.1"

[dev-dependencies]
tempfile = "3"
