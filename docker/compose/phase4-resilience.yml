# Phase 4 — Connection resilience and store-and-forward
# Topology: client ──── gateway ──── internet
#
# Tests require network manipulation from outside the container
# (docker network disconnect/connect, or iptables via a sidecar).
#
# Covers:
#   4.1 Docker: disconnect network → remove → reconnects automatically
#   4.2 Docker: buffer frames during 5 s outage → delivered after reconnect
#   4.4 Docker: TCP idle 4 min → still alive; idle 6 min → conntrack expired

name: pim-phase4-resilience

services:
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    container_name: pim-p4-gw
    hostname: gateway
    volumes:
      - ../configs/gateway.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      pim-net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP"]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 5s

  client:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    container_name: pim-p4-client
    hostname: client
    volumes:
      - ../configs/client.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      pim-net:
        ipv4_address: 172.20.0.30
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP"]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 8s

networks:
  pim-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
