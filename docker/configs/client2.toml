# Second client — for multi-client tests.
# Transport address: client2:9100  Mesh IP: 10.77.0.101/24

[node]
name = "client2"
data_dir = "/var/lib/pim"

[interface]
mesh_ip = "10.77.0.101/24"
mtu = 1400

[transport]
listen_port = 9100

[security]
key_file = "/var/lib/pim/node.key"

[[peers]]
address = "gateway:9100"
label = "gateway"
