# Client node — connected to two relays for redundant routing tests (Phase 2.3).
# Transport address: client:9100  Mesh IP: 10.77.0.100/24

[node]
name = "client"
data_dir = "/var/lib/pim"

[interface]
mesh_ip = "10.77.0.100/24"
mtu = 1400

[transport]
listen_port = 9100

[security]
key_file = "/var/lib/pim/node.key"

[[peers]]
address = "relay1:9100"
label = "relay1"

[[peers]]
address = "relay2:9100"
label = "relay2"
