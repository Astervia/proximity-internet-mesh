# Single-node config for Docker-based Bluetooth seam testing.
# No real Bluetooth hardware is required. The daemon reads interface state from
# a fake sysfs tree via PIM_BLUETOOTH_SYSFS_ROOT.

[node]
name = "bluetooth-seam"
data_dir = "/var/lib/pim"

[interface]
mtu = 1400

[discovery]
enabled = false

[transport]
listen_port = 9100

[security]
key_file = "/var/lib/pim/node.key"

[bluetooth]
enabled = true
interface = "bnep0"
radio_discovery_enabled = true
device_name_prefix = "PIM-"
local_alias = "PIM-bluetooth-seam"
auto_discover_peers = true
# Seam tests don't run a real DHCP client; the fake PAN already has a usable address.
request_dhcp = false
poll_interval_ms = 250
scan_interval_ms = 250
peer_discovery_interval_ms = 250
bluetoothctl_timeout_s = 2
discoverable_timeout_s = 60
startup_timeout_ms = 6000
