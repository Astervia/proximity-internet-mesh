[node]
name = "outsider"
data_dir = "/var/lib/pim"

[interface]
mtu = 1400

[discovery]
enabled = true

# No [mesh] section → open mesh. Outsider's plaintext discovery
# advertisements are ignored by private-mesh nodes (which expect
# encrypted ones), and the outsider can't decrypt the private-mesh
# advertisements either.

[transport]
listen_port = 9100

[security]
key_file = "/var/lib/pim/node.key"
require_encryption = true
authorization_policy = "allow_all"
trust_store_file = "/var/lib/pim/trusted-peers.toml"
