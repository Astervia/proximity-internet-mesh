name: Release Binaries

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: Build ${{ matrix.label }}
        runs-on: ${{ matrix.runner }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - label: linux-x86_64-musl
                      runner: ubuntu-latest
                      target: x86_64-unknown-linux-musl
                    - label: macos-x86_64
                      runner: macos-15-intel
                      target: x86_64-apple-darwin
                    - label: macos-aarch64
                      runner: macos-15
                      target: aarch64-apple-darwin

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@1.94.0
              with:
                  targets: ${{ matrix.target }}

            - name: Install Linux musl linker
              if: matrix.target == 'x86_64-unknown-linux-musl'
              run: sudo apt-get update && sudo apt-get install -y musl-tools

            - name: Cache cargo artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Build release binaries
              run: cargo build --workspace --release --locked --target "${{ matrix.target }}"

            - name: Package release artifacts
              shell: bash
              env:
                  TAG: ${{ github.ref_name }}
                  TARGET_TRIPLE: ${{ matrix.target }}
              run: |
                  set -euo pipefail
                  ASSET_DIR="pim-${TAG}-${TARGET_TRIPLE}"

                  mkdir -p "dist/${ASSET_DIR}"
                  cp "target/${TARGET_TRIPLE}/release/pim" "dist/${ASSET_DIR}/pim"
                  cp "target/${TARGET_TRIPLE}/release/pim-daemon" "dist/${ASSET_DIR}/pim-daemon"
                  chmod 755 "dist/${ASSET_DIR}/pim" "dist/${ASSET_DIR}/pim-daemon"

                  tar -C dist -czf "dist/${ASSET_DIR}.tar.gz" "${ASSET_DIR}"
                  (
                      cd dist
                      if command -v sha256sum >/dev/null 2>&1; then
                          sha256sum "${ASSET_DIR}.tar.gz" > "${ASSET_DIR}.sha256"
                      else
                          shasum -a 256 "${ASSET_DIR}.tar.gz" > "${ASSET_DIR}.sha256"
                      fi
                  )

            - name: Upload packaged artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: release-${{ matrix.target }}
                  path: |
                      dist/*.tar.gz
                      dist/*.sha256
                  if-no-files-found: error

    publish:
        name: Publish GitHub release
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Download packaged artifacts
              uses: actions/download-artifact@v8
              with:
                  path: dist
                  merge-multiple: true

            - name: Publish GitHub release
              uses: softprops/action-gh-release@v3
              with:
                  generate_release_notes: true
                  files: |
                      dist/*.tar.gz
                      dist/*.sha256
