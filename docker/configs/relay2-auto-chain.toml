# Auto-IP chain relay2 config.
# relay2 sits between relay1 and the client and must acquire its own mesh IP.

[node]
name = "relay2-auto-chain"
data_dir = "/var/lib/pim"

[interface]
mesh_ip = "auto"
mtu = 1400

[relay]
enabled = true

[transport]
listen_port = 9100
connect_timeout_ms = 3000

[discovery]
enabled = false

[security]
key_file = "/var/lib/pim/node.key"

[[peers]]
mechanism = "tcp"
address = "172.37.0.20:9100"
label = "relay1"
