name: Release Binaries

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build-and-publish:
        name: Build and publish release binaries
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Extract tag name
              id: vars
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@1.94.0

            - name: Cache cargo artifacts
              uses: Swatinem/rust-cache@v2

            - name: Build release binaries
              run: cargo build --workspace --release --locked

            - name: Package release artifacts
              env:
                  TAG: ${{ steps.vars.outputs.tag }}
              run: |
                  set -euo pipefail
                  TARGET_TRIPLE="x86_64-unknown-linux-gnu"
                  ASSET_DIR="pim-${TAG}-${TARGET_TRIPLE}"

                  mkdir -p "dist/${ASSET_DIR}"
                  install -Dm755 target/release/pim "dist/${ASSET_DIR}/pim"
                  install -Dm755 target/release/pim-daemon "dist/${ASSET_DIR}/pim-daemon"

                  tar -C dist -czf "dist/${ASSET_DIR}.tar.gz" "${ASSET_DIR}"
                  sha256sum "dist/${ASSET_DIR}.tar.gz" > "dist/${ASSET_DIR}.sha256"

            - name: Publish GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: |
                      dist/*.tar.gz
                      dist/*.sha256
