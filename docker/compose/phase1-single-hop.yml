# Phase 1 — Single-hop tunnel
# Topology: client ──── gateway ──── internet
#
# Covers:
#   1.5 Docker: two containers communicate over bridge network
#   1.6 Docker: TUN interface comes up, IP configured
#   1.7 Docker: gateway NATs traffic to external DNS
#   1.8 Docker: client pings gateway mesh IP; curl internet; DNS resolution; clean shutdown

name: pim-phase1-single-hop

services:
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    container_name: pim-p1-gw
    hostname: gateway
    volumes:
      - ../configs/gateway.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      pim-net:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP"]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 5s

  client:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    container_name: pim-p1-client
    hostname: client
    volumes:
      - ../configs/client.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      pim-net:
        ipv4_address: 172.30.0.30
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP"]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 8s

networks:
  pim-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/24
