# Single-node config for Docker-based Bluetooth seam testing.
# No real Bluetooth hardware is required. The daemon reads interface state from
# a fake sysfs tree via PIM_BLUETOOTH_SYSFS_ROOT.

[node]
name = "bluetooth-seam"
data_dir = "/var/lib/pim"

[interface]
mesh_ip = "10.77.0.50/24"
mtu = 1400

[discovery]
enabled = false

[transport]
listen_port = 9100

[security]
key_file = "/var/lib/pim/node.key"

[bluetooth]
enabled = true
interface = "bnep0"
peer_addresses = ["172.39.0.99"]
poll_interval_ms = 250
startup_timeout_ms = 6000
