[node]
name = "gateway"
data_dir = "/var/lib/pim"

[interface]
mesh_ip = "10.77.0.1/24"
mtu = 1400

[discovery]
enabled = true
shared_key = "1111111111111111111111111111111111111111111111111111111111111111"

[transport]
listen_port = 9100

[gateway]
enabled = true
nat_interface = "eth0"

[security]
key_file = "/var/lib/pim/node.key"
require_encryption = true
authorization_policy = "allow_list"
authorized_peers = ["6a3803d5f059902a1c6dafbc9ba47292"]
trust_store_file = "/var/lib/pim/trusted-peers.toml"
