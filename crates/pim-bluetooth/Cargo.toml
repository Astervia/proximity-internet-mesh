[package]
name = "pim-bluetooth"
version = "0.1.9"
edition = "2021"
description = "Bluetooth transport implementation for the Proximity Internet Mesh"
license.workspace = true
repository.workspace = true

[dependencies]
libc = { workspace = true }
pim-core = { workspace = true }
pim-crypto = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Phase 7 RFCOMM auto-discovery — JSON identity exchange on top of the
# raw Bluetooth socket. Kept in the base deps (not target-gated) because
# the codec module is unit-tested on every platform; the actual socket
# code is `cfg(target_os = "linux")` only.
serde = { workspace = true }
serde_json = { workspace = true }

# BlueZ D-Bus client (LE GAP advertising + scan, Phase 4 of the L2CAP
# CoC plan). Linux-only — the crate has no portable backend, so it
# only enters the build on Linux targets. `default-features = false`
# strips the `id` (Apple ProductID), `gatt`, and `mesh` features we
# don't use, keeping the dependency surface and compile time
# reasonable.
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", default-features = false, features = ["bluetoothd"] }
futures-util = "0.3"
