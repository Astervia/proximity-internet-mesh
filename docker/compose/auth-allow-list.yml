name: pim-auth-allow-list

services:
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    hostname: gateway
    entrypoint:
      - /bin/bash
      - -lc
      - "printf '\\001%.0s' $(seq 1 32) > /var/lib/pim/node.key && exec /entrypoint.sh"
    volumes:
      - ../configs/auth/allow-list-gateway.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      pim-net:
        ipv4_address: 172.42.0.10
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP",
        ]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 5s

  client:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    hostname: client
    entrypoint:
      - /bin/bash
      - -lc
      - "printf '\\002%.0s' $(seq 1 32) > /var/lib/pim/node.key && exec /entrypoint.sh"
    volumes:
      - ../configs/auth/allow-list-client.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      pim-net:
        ipv4_address: 172.42.0.20
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP",
        ]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 8s

  intruder:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    hostname: intruder
    entrypoint:
      - /bin/bash
      - -lc
      - "printf '\\003%.0s' $(seq 1 32) > /var/lib/pim/node.key && exec /entrypoint.sh"
    volumes:
      - ../configs/auth/allow-list-intruder.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      pim-net:
        ipv4_address: 172.42.0.30
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP",
        ]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 8s

networks:
  pim-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.42.0.0/24
