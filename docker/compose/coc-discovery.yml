name: pim-coc-discovery

# AF_BLUETOOTH (incl. BTPROTO_L2CAP) is per-network-namespace on Linux.
# A bridge-mode Docker container can't bind an L2CAP CoC socket either
# — `bind L2CAP CoC psm 0x0083: Address family not supported by protocol`.
# This lab leans on that failure on purpose: it asserts the daemon
# survives CoC bind failure and keeps the rest of the stack running.
# End-to-end CoC peering needs a hardware bench (see `docs/research/`).

services:
  node:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    container_name: pim-coc-discovery-node
    hostname: node
    environment:
      RUST_LOG: pim_bluetooth=debug,pim_daemon=info,info
    volumes:
      - ../configs/coc-discovery.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      pim-net:
        ipv4_address: 172.40.0.10
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP"]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 5s

networks:
  pim-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.40.0.0/24
