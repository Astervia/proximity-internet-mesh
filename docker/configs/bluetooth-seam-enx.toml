# Single-node config for Docker-based Bluetooth seam testing of dynamic Linux
# PAN interface fallback from a configured bnep name to a live enx* interface.

[node]
name = "bluetooth-seam-enx"
data_dir = "/var/lib/pim"

[interface]
mesh_ip = "10.77.0.51/24"
mtu = 1400

[discovery]
enabled = false

[transport]
listen_port = 9100

[security]
key_file = "/var/lib/pim/node.key"

[bluetooth]
enabled = true
interface = "bnep0"
radio_discovery_enabled = true
device_name_prefix = "PIM-"
local_alias = "PIM-bluetooth-seam-enx"
connect_pan = true
serve_nap = false
nap_bridge = "br-bt"
auto_discover_peers = true
poll_interval_ms = 250
scan_interval_ms = 250
peer_discovery_interval_ms = 250
bluetoothctl_timeout_s = 2
discoverable_timeout_s = 60
startup_timeout_ms = 6000
