# Client node — connects via single relay (multi-hop path).
# Transport address: client:9100  Mesh IP: 10.77.0.100/24

[node]
name = "client"
data_dir = "/var/lib/pim"

[interface]
mesh_ip = "10.77.0.100/24"
mtu = 1400

[transport]
listen_port = 9100

[security]
key_file = "/var/lib/pim/node.key"

[[peers]]
address = "relay:9100"
label = "relay"
