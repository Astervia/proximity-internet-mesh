# Phase 2 (plans/rfcomm-reconnect/plan.md) opt-in peer cleanup lab.
#
# RFCOMM bind still fails inside the container's network namespace,
# but the cleanup task does NOT depend on AF_BLUETOOTH — it shells
# out to `bluetoothctl` (a fake here) and operates on the lifecycle
# SQLite table populated by the daemon's RFCOMM event loop. The lab
# forces both sides:
#
#   1. RFCOMM startup fails (same as rfcomm-discovery.yml).
#   2. The cleanup task still spawns and ticks because it lives in
#      the daemon and doesn't share a fate with the RFCOMM service.
#
# Aggressive timing keeps the lab fast: 60 s sweep cadence (the
# clamped minimum interval), 1 h unreachable lifetime (also the
# clamped minimum). The seeded lifecycle row's
# `first_paired_at_s` is two days ago so the very first sweep
# already passes the lifetime bar.

[node]
name = "rfcomm-cleanup"
data_dir = "/var/lib/pim"

[interface]
mtu = 1400

[discovery]
enabled = false

[transport]
listen_port = 9100

[security]
key_file = "/var/lib/pim/node.key"

[bluetooth]
enabled = false

[bluetooth_rfcomm]
enabled = true
channel = 22
device_name_prefix = "PIM-"
outbound_enabled = true
poll_interval_ms = 1500
bridge_to_tcp = false

# Cleanup knobs — subsection-style after the centralized
# `PeerCleanupConfig` refactor. Lifetime + interval clamp to their
# floors at runtime (1 h / 60 s); the seeded row is two days old
# so the first sweep removes it regardless.
[bluetooth_rfcomm.peer_cleanup]
enabled = true
max_unreachable_lifetime_s = 60
cleanup_interval_s = 1
