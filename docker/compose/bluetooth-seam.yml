name: pim-bluetooth-seam

services:
  node:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    container_name: pim-bt-seam
    hostname: node
    entrypoint:
      - /bin/bash
      - -lc
      - mkdir -p /tmp/fake-sysfs/bnep0; printf 'down\n' > /tmp/fake-sysfs/bnep0/operstate; (sleep 2; printf 'up\n' > /tmp/fake-sysfs/bnep0/operstate) & exec /entrypoint.sh
    environment:
      PIM_BLUETOOTH_SYSFS_ROOT: /tmp/fake-sysfs
      RUST_LOG: debug
    volumes:
      - ../configs/bluetooth-seam.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      pim-net:
        ipv4_address: 172.39.0.10
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP"]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 5s

networks:
  pim-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.39.0.0/24
