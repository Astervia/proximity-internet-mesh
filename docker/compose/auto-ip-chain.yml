# Phase 8 — Routed auto-IP chain with late gateway join
# Topology: gateway <-> relay1 <-> relay2 <-> client
#
# Goal:
# - relay1, relay2, and client all use mesh_ip = "auto"
# - the gateway starts late
# - once the gateway joins, all downstream auto peers should receive a mesh IP
#   and the client should reach the gateway/internet through the chain

name: pim-auto-ip-chain

services:
    gateway:
        build:
            context: ../..
            dockerfile: Dockerfile
        image: pim:latest
        container_name: pim-auto-ip-chain-gw
        hostname: gateway
        volumes:
            - ../configs/gateway-auto-chain.toml:/etc/pim/pim.toml:ro
        cap_add:
            - NET_ADMIN
            - NET_RAW
        devices:
            - /dev/net/tun:/dev/net/tun
        sysctls:
            net.ipv4.ip_forward: "1"
            net.ipv4.ip_local_port_range: "60000 65535"
        networks:
            pim-net:
                ipv4_address: 172.37.0.10
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP",
                ]
            interval: 2s
            timeout: 4s
            retries: 25
            start_period: 5s

    relay1:
        build:
            context: ../..
            dockerfile: Dockerfile
        image: pim:latest
        container_name: pim-auto-ip-chain-relay1
        hostname: relay1
        volumes:
            - ../configs/relay1-auto-chain.toml:/etc/pim/pim.toml:ro
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        networks:
            pim-net:
                ipv4_address: 172.37.0.20
        healthcheck:
            test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null"]
            interval: 2s
            timeout: 4s
            retries: 25
            start_period: 5s

    relay2:
        build:
            context: ../..
            dockerfile: Dockerfile
        image: pim:latest
        container_name: pim-auto-ip-chain-relay2
        hostname: relay2
        volumes:
            - ../configs/relay2-auto-chain.toml:/etc/pim/pim.toml:ro
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        networks:
            pim-net:
                ipv4_address: 172.37.0.21
        healthcheck:
            test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null"]
            interval: 2s
            timeout: 4s
            retries: 25
            start_period: 5s

    client:
        build:
            context: ../..
            dockerfile: Dockerfile
        image: pim:latest
        container_name: pim-auto-ip-chain-client
        hostname: client
        volumes:
            - ../configs/client-auto-chain.toml:/etc/pim/pim.toml:ro
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        networks:
            pim-net:
                ipv4_address: 172.37.0.30
        healthcheck:
            test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null"]
            interval: 2s
            timeout: 4s
            retries: 25
            start_period: 5s

networks:
    pim-net:
        driver: bridge
        ipam:
            driver: default
            config:
                - subnet: 172.37.0.0/24
