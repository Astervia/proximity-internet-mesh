name: Quality & Security (Rust)

on:
    push:
        branches: [main]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

concurrency:
    group: quality-security-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-and-test:
        name: Code Quality – Format, Clippy & Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@1.94.0
              with:
                  components: rustfmt, clippy

            - name: Cache cargo artifacts
              uses: Swatinem/rust-cache@v2

            # pim-bluetooth pulls in `bluer` on Linux, which links against
            # libdbus-1 via libdbus-sys. The hosted ubuntu runner doesn't
            # ship the dev headers, so cargo's build script panics during
            # the first clippy/test compile without these.
            - name: Install Linux build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libdbus-1-dev pkg-config

            - name: Check formatting
              run: cargo fmt --all --check

            - name: Run clippy
              run: cargo clippy --workspace --all-targets --locked -- -D warnings

            - name: Run tests
              run: cargo test --workspace --locked

            - name: Check config generators
              run: scripts/test-config-generators.sh

    platform-validation:
        name: Platform Validation (${{ matrix.label }})
        runs-on: ${{ matrix.runner }}
        needs: lint-and-test

        strategy:
            fail-fast: false
            matrix:
                include:
                    - label: linux
                      runner: ubuntu-latest
                    - label: macos
                      runner: macos-15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@1.94.0

            - name: Cache cargo artifacts
              uses: Swatinem/rust-cache@v2

            # `bluer` is `cfg(target_os = "linux")` only, so macOS doesn't
            # need libdbus. Linux runners do.
            - name: Install Linux build dependencies
              if: startsWith(matrix.runner, 'ubuntu')
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libdbus-1-dev pkg-config

            - name: Run tests
              run: cargo test --workspace --locked

            - name: Check config generators
              run: scripts/test-config-generators.sh

            - name: Build release binaries
              run: cargo build --workspace --release --locked

    security:
        name: Dependency Security Scan (cargo-audit)
        runs-on: ubuntu-latest
        needs: platform-validation

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@1.94.0

            - name: Cache cargo artifacts
              uses: Swatinem/rust-cache@v2

            - name: Install cargo-audit
              run: cargo install cargo-audit --locked

            - name: Run cargo-audit
              run: cargo audit
