# Phase 7 — Auto-discovery client config.
# NO [[peers]] — all connections formed via UDP broadcast discovery.
# Advertises: CLIENT (capabilities 0x01)

[node]
name = "client-auto-discovery"
data_dir = "/var/lib/pim"

[interface]
mtu = 1400

[discovery]
enabled = true
port = 9101
broadcast_interval_ms = 5000
peer_timeout_ms = 30000
connect_relays = true
connect_gateways = true

[transport]
listen_port = 9100

[security]
key_file = "/var/lib/pim/node.key"
