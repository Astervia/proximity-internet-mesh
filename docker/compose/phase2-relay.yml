# Phase 2 — Multi-hop relay
# Topology: client ──── relay ──── gateway ──── internet
#
# Covers:
#   2.1 Docker: client → relay → gateway, client curls internet
#   2.2 Docker: packet capture on relay shows only encrypted E2E payload
#   2.4 Docker: 10 KB payload transferred intact through the mesh

name: pim-phase2-relay

services:
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    container_name: pim-p2-gw
    hostname: gateway
    volumes:
      - ../configs/gateway.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      pim-net:
        ipv4_address: 172.31.0.10
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP"]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 5s

  relay:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    container_name: pim-p2-relay
    hostname: relay
    volumes:
      - ../configs/relay.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      pim-net:
        ipv4_address: 172.31.0.20
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP"]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 8s

  client:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    container_name: pim-p2-client
    hostname: client
    volumes:
      - ../configs/client-relay.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      relay:
        condition: service_healthy
    networks:
      pim-net:
        ipv4_address: 172.31.0.30
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP"]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 12s

networks:
  pim-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.31.0.0/24
