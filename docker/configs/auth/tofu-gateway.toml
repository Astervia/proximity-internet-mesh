[node]
name = "gateway"
data_dir = "/var/lib/pim"

[interface]
mtu = 1400

[discovery]
enabled = true

[transport]
listen_port = 9100

[gateway]
enabled = true
nat_interface = "eth0"

[security]
key_file = "/var/lib/pim/node.key"
require_encryption = true
authorization_policy = "trust_on_first_use"
trust_store_file = "/var/lib/pim/trusted-peers.toml"
