[workspace]
resolver = "2"
members = [
    "crates/pim-core",
    "crates/pim-bluetooth",
    "crates/pim-crypto",
    "crates/pim-protocol",
    "crates/pim-transport",
    "crates/pim-tun",
    "crates/pim-gateway",
    "crates/pim-discovery",
    "crates/pim-routing",
    "crates/pim-wifidirect",
    "crates/pim-daemon",
    "crates/pim-cli",
]

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bytes = "1"
byteorder = "1"
bitflags = "2"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Crypto
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
hkdf = "0.13"
sha2 = "0.10"
hmac = "0.12"
rand = "0.10"

# Networking
nix = { version = "0.31", features = ["net", "ioctl"] }
libc = "0.2"

# Async utilities
tokio-util = { version = "0.7", features = ["full"] }

# Internal crates
pim-core = { path = "crates/pim-core" }
pim-bluetooth = { path = "crates/pim-bluetooth" }
pim-crypto = { path = "crates/pim-crypto" }
pim-protocol = { path = "crates/pim-protocol" }
pim-transport = { path = "crates/pim-transport" }
pim-tun = { path = "crates/pim-tun" }
pim-gateway = { path = "crates/pim-gateway" }
pim-discovery = { path = "crates/pim-discovery" }
pim-routing = { path = "crates/pim-routing" }
pim-wifidirect = { path = "crates/pim-wifidirect" }
