# Client node — IPv4 + IPv6 single-hop Docker tests.

[node]
name = "client-v6"
data_dir = "/var/lib/pim"

[interface]
mesh_ip = "10.77.0.100/24"
mesh_ipv6 = "fd77::100/64"
mtu = 1400

[transport]
listen_port = 9100

[security]
key_file = "/var/lib/pim/node.key"

[[peers]]
mechanism = "tcp"
address = "gateway:9100"
label = "gateway-v6"
