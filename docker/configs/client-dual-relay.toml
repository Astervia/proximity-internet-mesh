# Client node — connected to two relays for redundant routing tests (Phase 2.3).

[node]
name = "client"
data_dir = "/var/lib/pim"

[interface]
mtu = 1400

[transport]
listen_port = 9100

[security]
key_file = "/var/lib/pim/node.key"

[[peers]]
mechanism = "tcp"
address = "relay1:9100"
label = "relay1"

[[peers]]
mechanism = "tcp"
address = "relay2:9100"
label = "relay2"
