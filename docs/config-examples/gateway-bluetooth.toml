dhcp_lease_time = "12h"
# Optional DNS list advertised to DHCP clients. When unset, the daemon inherits
# upstream resolvers from /etc/resolv.conf at runtime.
dhcp_dns = "1.1.1.1,8.8.8.8"
# Gateway serves DHCP; it doesn't need to request one itself.
request_dhcp = false
auto_discover_peers = true
poll_interval_ms = 2000
scan_interval_ms = 5000
peer_discovery_interval_ms = 2000
bluetoothctl_timeout_s = 15
discoverable_timeout_s = 180
startup_timeout_ms = 15000

