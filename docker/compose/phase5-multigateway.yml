# Phase 5 — Multi-gateway and load balancing
# Topology:
#             ┌── gateway1 ── internet
#  client ── relay
#             └── gateway2 ── internet
#
# Covers:
#   5.1 Docker: kill preferred gateway → failover to gateway2; restore → may shift back
#   5.2 Docker: saturate gateway1 → new flows use gateway2
#   5.3 Docker: tc netem latency on gateway1 → client prefers gateway2

name: pim-phase5-multigateway

services:
  gateway1:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    container_name: pim-p5-gw1
    hostname: gateway1
    volumes:
      - ../configs/gateway1.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      pim-net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP"]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 5s

  gateway2:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    container_name: pim-p5-gw2
    hostname: gateway2
    volumes:
      - ../configs/gateway2.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      pim-net:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP"]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 5s

  relay:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    container_name: pim-p5-relay
    hostname: relay
    volumes:
      - ../configs/relay-multigateway.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
    depends_on:
      gateway1:
        condition: service_healthy
      gateway2:
        condition: service_healthy
    networks:
      pim-net:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP"]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 8s

  client:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pim:latest
    container_name: pim-p5-client
    hostname: client
    volumes:
      - ../configs/client-relay.toml:/etc/pim/pim.toml:ro
    cap_add:
      - NET_ADMIN
    depends_on:
      relay:
        condition: service_healthy
    networks:
      pim-net:
        ipv4_address: 172.20.0.30
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/pim.pid && kill -0 $(cat /run/pim.pid) 2>/dev/null && ip link show pim0 2>/dev/null | grep -q UP"]
      interval: 2s
      timeout: 4s
      retries: 25
      start_period: 12s

networks:
  pim-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
