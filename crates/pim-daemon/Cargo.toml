[package]
name = "pim-daemon"
version = "0.1.15"
edition = "2021"
description = "Background daemon process for the Proximity Internet Mesh"
license.workspace = true
repository.workspace = true

# Phase A: ship both `lib` (rlib) and the existing `bin` so the daemon
# can be linked in-process by mobile embeddings (Phase B Android, future
# iOS) without changing the standalone binary path used by Linux/macOS
# desktop deployments. `cdylib` is intentionally NOT enabled here yet —
# Phase B turns it on once the JNI bridge is in place.
[lib]
name = "pim_daemon"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "pim-daemon"
path = "src/main.rs"

[dependencies]
pim-bluetooth = { workspace = true }
pim-core = { workspace = true }
pim-crypto = { workspace = true }
pim-protocol = { workspace = true }
pim-transport = { workspace = true }
pim-tun = { workspace = true }
pim-gateway = { workspace = true }
pim-discovery = { workspace = true }
pim-routing = { workspace = true }
pim-wifidirect = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
bytes = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
libc = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
