[bluetooth]

enabled = true
interface = "auto"
# Run this gateway in dual-role Bluetooth PAN mode:
# - serve a local NAP on `nap_bridge`
# - also scan/connect outward as a PAN client when peers are discovered
radio_discovery_enabled = true
device_name_prefix = "PIM-"
local_alias = "PIM-gatewaybtonly"
connect_pan = false # Use true to test simultaneous PAN client/AP
serve_nap = true
nap_bridge = "br-bt"
# IPv4 address/CIDR assigned to `nap_bridge` when the daemon creates it.
nap_bridge_addr = "192.168.44.1/24"
# Run a daemon-supervised dnsmasq DHCP server on the bridge for PAN clients.
